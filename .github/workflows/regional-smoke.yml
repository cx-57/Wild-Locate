name: regional-smoke

on:
  workflow_dispatch:

jobs:
  live-regional-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify live regional services
        run: |
          python - <<'PY'
          import math
          from wildlocate.core.data.inaturalist import resolve_species, download_species_observations, clean_species_observations
          from wildlocate.core.data.regional import extract_regional_features

          cases = [
              ('FL', 'Marsh Rabbit', 28.1, -81.6),
              ('AZ', 'Black-tailed Jackrabbit', 32.25, -110.9),
          ]

          for region, species_name, latitude, longitude in cases:
              taxon = resolve_species(species_name)
              raw = download_species_observations(
                  taxon['common_name'],
                  place_name={'FL': 'Florida', 'AZ': 'Arizona'}[region],
                  max_observations=3,
                  taxon_id=taxon['taxon_id'],
              )
              cleaned = clean_species_observations(raw)
              if raw.empty:
                  raise RuntimeError(f'{region}: iNaturalist returned no observations')

              features = extract_regional_features(latitude, longitude, region, print)
              if len(features) != 22:
                  raise RuntimeError(f'{region}: expected 22 regional features, got {len(features)}')
              bad = {name: value for name, value in features.items() if not math.isfinite(value)}
              if bad:
                  raise RuntimeError(f'{region}: non-finite features: {bad}')

              print(f'{region} OK: taxon={taxon["common_name"]!r}, raw={len(raw)}, cleaned={len(cleaned)}, features={len(features)}')
          PY
