name: arizona-pilot

on:
  push:
    branches:
      - clean-habitat-rebuild

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WILDLOCATE_DATA_DIR: ${{ github.workspace }}/artifacts/arizona-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Train Arizona Black-tailed Jackrabbit pilot
        run: |
          python scripts/train_region_pilot.py \
            --region AZ \
            --species "Black-tailed Jackrabbit" \
            --observations 80
