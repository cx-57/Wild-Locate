name: 3dep-probe

on:
  push:
    branches:
      - clean-habitat-rebuild

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install requests pyproj
      - name: Probe 3DEP exportImage size and extent
        run: |
          python - <<'PY'
          import requests
          from pyproj import Transformer

          url = 'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage'
          lat, lon = 28.1, -81.6
          transformer = Transformer.from_crs('EPSG:4326', 'EPSG:5070', always_xy=True)
          x, y = transformer.transform(lon, lat)
          small_bbox = f'{x-3000},{y-3000},{x+3000},{y+3000}'
          production_bbox = '1318800,598800,1441200,721200'

          variants = [
              ('small-extent-1360', small_bbox, '1360,1360', 'RSP_BilinearInterpolation'),
              ('production-extent-512', production_bbox, '512,512', 'RSP_BilinearInterpolation'),
              ('production-extent-1024', production_bbox, '1024,1024', 'RSP_BilinearInterpolation'),
              ('production-extent-1360', production_bbox, '1360,1360', 'RSP_BilinearInterpolation'),
              ('production-extent-1360-nearest', production_bbox, '1360,1360', 'RSP_NearestNeighbor'),
          ]

          for name, bbox, size, interpolation in variants:
              params = {
                  'bbox': bbox,
                  'bboxSR': 5070,
                  'imageSR': 5070,
                  'size': size,
                  'format': 'tiff',
                  'pixelType': 'F32',
                  'noData': -9999,
                  'interpolation': interpolation,
                  'f': 'image',
              }
              try:
                  response = requests.get(url, params=params, timeout=120, stream=True)
                  print(name, 'status=', response.status_code, 'type=', response.headers.get('content-type'), 'bytes=', len(response.content))
                  if response.status_code != 200:
                      print('body=', response.text[:300].replace('\n', ' '))
              except Exception as exc:
                  print(name, 'EXCEPTION', repr(exc))
          PY
