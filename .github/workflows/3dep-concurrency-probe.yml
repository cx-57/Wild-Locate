name: 3dep-fallback-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Probe failing 3DEP tile sizes and subtiles
        run: |
          python - <<'PY'
          import requests

          url = 'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage'
          failing = (1558800, 358800, 1681200, 481200)

          def fetch(name, bbox, size):
              params = {
                  'bbox': ','.join(map(str, bbox)), 'bboxSR': 5070, 'imageSR': 5070,
                  'size': size, 'format': 'tiff', 'pixelType': 'F32',
                  'noData': -9999, 'interpolation': 'RSP_BilinearInterpolation', 'f': 'image',
              }
              with requests.get(url, params=params, timeout=240, stream=True) as response:
                  total = sum(len(chunk) for chunk in response.iter_content(1024 * 1024))
                  print(name, 'status=', response.status_code, 'bytes=', total)

          for repeat in range(1, 4):
              fetch(f'full-1360-repeat-{repeat}', failing, '1360,1360')
          fetch('full-1024', failing, '1024,1024')
          fetch('full-512', failing, '512,512')

          x0, y0, x1, y1 = failing
          xm, ym = (x0 + x1) / 2, (y0 + y1) / 2
          quarters = [
              (x0, y0, xm, ym),
              (xm, y0, x1, ym),
              (x0, ym, xm, y1),
              (xm, ym, x1, y1),
          ]
          for index, bbox in enumerate(quarters, 1):
              fetch(f'quarter-{index}', bbox, '680,680')
          PY
