name: cleanup-check

on:
  pull_request:
    branches: [main]

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q wildlocate tests
      - name: Editable install
        run: python -m pip install -e . --no-deps
      - name: Import outside repository
        run: cd /tmp && python -c "import wildlocate; print(wildlocate.__file__)"
      - name: Console entry point
        run: cd /tmp && wildlocate --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check wildlocate/web/app.js
