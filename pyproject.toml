[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "wildlocate"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "joblib",
    "numpy",
    "pandas",
    "platformdirs",
    "pyproj",
    "PyQt6",
    "PyQt6-WebEngine",
    "rasterio",
    "requests",
    "scikit-learn",
    "xgboost",
    "shapely",
]

[project.scripts]
wildlocate = "wildlocate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wildlocate*"]
namespaces = true

[tool.setuptools.package-data]
"wildlocate" = [
    "core/data/state_boundaries.geojson",
    "gui/map/index.html",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "gui/map/vendor/*",
    "data/processed/models/*.joblib",
    "data/processed/models/*.json",
    "data/processed/features/species/*.csv",
]
